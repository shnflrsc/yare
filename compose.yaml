services:
  postgres:
    image: postgres:15-alpine
    container_name: yare-postgres

    environment:
      POSTGRES_DB: ${DATABASE_NAME:-yare}
      POSTGRES_USER: ${DATABASE_USER:-admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}

    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d yare"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  ministack:
    image: ministackorg/ministack:latest
    container_name: yare-ministack

    ports:
      - "127.0.0.1:4566:4566"

    environment:
      GATEWAY_PORT: 4566
      LOG_LEVEL: INFO
      S3_PERSIST: 1
      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - ministack-s3:/tmp/ministack-data/s3

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: yare-ministack-redis

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

  ministack-infra:
    image: amazon/aws-cli:2.36.44

    container_name: yare-ministack-infra

    depends_on:
      ministack:
        condition: service_healthy

    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_S3_REGION:-ap-southeast-1}

    volumes:
      - ./infra:/infra:ro

    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        aws --endpoint-url=http://ministack:4566 cloudformation deploy \
          --template-file /infra/storage.yaml \
          --stack-name yare-storage \
          --parameter-overrides BucketName=${AWS_S3_BUCKET:-yare-files-uploads-dev-ap-southeast-1} \
          --no-fail-on-empty-changeset

volumes:
  postgres-data:
  ministack-s3:
  redis-data:
